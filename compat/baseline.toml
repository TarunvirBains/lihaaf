# Compat-mode §5 pilot-gate baseline table.
#
# Each top-level table is one enrolled pilot crate (by its upstream
# `[package].name`). `n_max` is the per-crate "shrinking-only" ceiling:
# the maximum `results.mismatch_count` the §5 gate accepts for that
# crate. The number MAY DECREASE in subsequent PRs (a pilot recording a
# stabler run reduces its ceiling) but MUST NOT INCREASE without
# explicit review.
#
# v0.1.0-beta.4 ships this table empty: no pilots are enrolled. Each
# pilot crate adds its first entry via a PR to this repo once its first
# stable run is recorded. The shrinking-only rule is enforced by PR
# review, not by the gate itself (the gate reads only the current
# ceiling).
#
# Schema (per `src/compat/gate.rs::parse_baseline`):
#
#     [crate-name]
#     n_max = <non-negative integer>
#     expected_exit_code = <integer, optional>
#
# `expected_exit_code` is the §5 expected-fail surface: when set, the
# gate allows BOTH baseline and lihaaf exit codes to equal that value
# (not `0`) without flagging the run as broken. Used by pilots whose
# baseline `cargo test` legitimately exits non-zero. Omit the key to
# require both exit codes equal `0`.
#
# Example (do not uncomment; left here for reference):
#
#     [serde-json]
#     n_max = 12
#
#     [anyhow]
#     n_max = 3
#
#     [pilot-with-documented-fail]
#     n_max = 0
#     expected_exit_code = 101
#
