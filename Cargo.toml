[package]
name = "lihaaf"
version = "0.1.0-beta.8"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Tarunvir Bains"]
rust-version = "1.95"
repository = "https://github.com/TarunvirBains/lihaaf"
homepage = "https://github.com/TarunvirBains/lihaaf"
description = "Fast compile-fail and compile-pass test harness for Rust proc macros; a faster trybuild-style workflow"
keywords = ["trybuild", "proc-macro", "compile-fail", "testing", "rustc"]
categories = ["development-tools::testing", "development-tools::procedural-macro-helpers"]
documentation = "https://docs.rs/lihaaf"
readme = "README.md"

# Exclude the FIX_BEFORE_BETA Spec D integration corpus from the
# published package and from cargo's implicit single-package
# workspace discovery. The corpus lives under `tests/integration_corpus/`
# and has its own nested Cargo.toml (a regular library) plus a sibling
# `macros/` proc-macro crate. Without the exclude, `cargo build` /
# `cargo publish` for lihaaf itself would try to interpret the nested
# manifests as part of the package and the corpus would ship to
# crates.io.
#
# The Phase 6 (§3.2.1) `tests/compat/discovery_corpus/` fixtures are
# DELIBERATELY NOT excluded — the `discovery_syn` integration test
# registered below asserts that the corpus exists on disk and feeds
# each scenario to the syn AST walker. Excluding them would ship a
# .crate artifact whose `cargo test` invocation fails on a missing
# corpus, defeating the purpose of `cargo publish --dry-run` as a
# release-gate signal.
exclude = ["tests/integration_corpus/"]

# Pre-release alpha — adopters must pin the exact version
# (`cargo install lihaaf` without a version selector will not pick up
# pre-release tags by design). The `publish = true` flag activates
# crates.io upload; do not set unless v0.1.0-alpha.1 (or later) is the
# intended release.
publish = true

# Cargo subcommand convention — `cargo-<subcommand>` binary on PATH is
# discovered by cargo. The binary strips its first argument (`lihaaf`)
# before dispatching.
[[bin]]
name = "cargo-lihaaf"
path = "src/bin/cargo-lihaaf.rs"

# Compat-mode integration tests live under `tests/compat/`. Cargo's
# auto-discovery only picks up files at the top of `tests/`; for files
# inside a subdirectory the `[[test]]` entry below registers them so
# `cargo test --test cli_mode_errors` works.
[[test]]
name = "cli_mode_errors"
path = "tests/compat/cli_mode_errors.rs"

[[test]]
name = "overlay_determinism"
path = "tests/compat/overlay_determinism.rs"

[[test]]
name = "argv_baseline_no_shell"
path = "tests/compat/argv_baseline_no_shell.rs"

[[test]]
name = "baseline_conservative"
path = "tests/compat/baseline_conservative.rs"

[[test]]
name = "cleanup_dirty_worktree"
path = "tests/compat/cleanup_dirty_worktree.rs"

[[test]]
name = "discovery_syn"
path = "tests/compat/discovery_syn.rs"

[[test]]
name = "normalizer_compat_cargo"
path = "tests/compat/normalizer_compat_cargo.rs"

[[test]]
name = "report_determinism"
path = "tests/compat/report_determinism.rs"

[[test]]
name = "toolchain_resolution"
path = "tests/compat/toolchain_resolution.rs"

[[test]]
name = "gate_smoke"
path = "tests/compat/gate_smoke.rs"

[dependencies]
# CLI parsing — derive feature for the typed argument struct in `cli.rs`.
clap = { version = "4", features = ["derive"] }

# Cargo manifest parsing — `[package.metadata.lihaaf]` is read out of the
# consumer's Cargo.toml. `toml` crate handles parse + value-typing
# (string / integer / array of strings). 1.x changed the `FromStr for
# Value` impl to parse a single value rather than a whole document; we
# go through `toml::from_str::<Value>` instead, which keeps the
# document-parse path explicit at every call site.
toml = "1"

# Manifest serialization — `target/lihaaf/manifest.json` is JSON for
# trivial CLI debuggability (`jq`, etc.). `preserve_order` keeps key
# ordering stable across rewrites.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# SHA-256 over the dylib bytes. The freshness check (Section 4.5)
# re-hashes on every fixture dispatch.
sha2 = "0.11"

# Per-session temp directory. Stable, dep-tree light, handles
# cross-platform temp roots correctly. The alternative is hand-rolling
# `std::env::temp_dir() + random suffix + cleanup` and silently getting
# it wrong on macOS where the system can rotate temp roots.
tempfile = "3"

# Static AST analysis for compat-mode fixture-invocation discovery
# (Spec §3.2.1, Phase 6). A string-scan over `tests/*.rs` would
# produce non-deterministic matches across crate styles; `syn`'s typed
# visitor (`syn::visit::Visit<'_>`) bounds the recognized set to the
# three patterns the spec names (direct `TestCases` calls, glob
# arguments, `#[test]`-wrapped invocations) and produces the same
# result on every clean-state run.
#
# Features:
#   - `full`     — needed for `#[test] fn ...` item parsing (`syn::ItemFn`).
#   - `visit`    — exposes the `syn::visit::Visit<'ast>` trait.
#   - `parsing`  — `syn::parse_file(&str)` entry point.
#
# Pin to the major: `2` is current stable; `2.0.x` is already in the
# build tree transitively via `clap_derive` and `serde_derive`, so
# adding it as a direct dependency adds no new graph node — the
# additional compile cost is only the lihaaf code that calls into the
# visitor.
#
# The §6.1 "no regex" rule is preserved — `syn = "2"` does NOT pull a
# `regex` / `regex-syntax` / `regex-automata` crate (verified by
# `cargo tree | grep -E "regex(-syntax|-automata)?"` returning zero
# lines after this dep is added).
syn = { version = "2", features = ["full", "visit", "parsing"] }

# `Span::start()` is gated on proc-macro2's `span-locations` feature
# (see proc-macro2's `#[cfg(span_locations)]` in `lib.rs`). The compat
# discovery walk needs line numbers to emit `discovery_unrecognized`
# entries with file + line citations and to stamp `CallSite.line` on
# every recognized fixture, so the feature must be activated. The
# dependency is already in the graph transitively via `syn` and
# `clap_derive`; declaring it explicitly here only toggles the feature.
proc-macro2 = { version = "1", features = ["span-locations"] }

# Unix syscalls — `kill(2)` for spec §5.4 worker termination and
# `sysconf(_SC_PAGESIZE)` for spec §5.4 RSS conversion. The `libc`
# crate is the canonical curated source for POSIX FFI signatures and
# constants; using it instead of hand-rolled `extern "C"` blocks keeps
# signatures right across glibc/musl/macOS variants and shifts the
# audit burden to the well-reviewed crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows FFI — `LockFileEx` / `UnlockFileEx` for the session lock
# (FIX_BEFORE_BETA Spec B, issue #1). `windows-sys` is the Microsoft-
# published curated bindings crate; same justification shape as the
# Unix `libc` block above (canonical FFI source, audited externally,
# small compile cost, no transitive deps).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",     # Spec B
    "Win32_System_IO",              # Spec B
    "Win32_Foundation",             # Spec B
    "Win32_System_Threading",       # Spec C — OpenProcess
    "Win32_System_ProcessStatus",   # Spec C — GetProcessMemoryInfo
] }

# No regex engine, ever. Spec §6.1. Every string match in this crate
# goes through stdlib `str::find`, `split_once`, `starts_with`, byte
# iteration, or sorted-slice lookup. Linux per-process RSS uses
# `/proc/<pid>/statm` directly via stdlib file I/O. The §3.2.1 fixture
# discovery walk uses `syn` (declared above) for AST analysis — `syn`
# does NOT pull a regex crate (verified by `cargo tree | grep regex`
# returning zero lines).

[features]
# Self-test marker for the multi-suite end-to-end corpus
# (`tests/lihaaf/compile_pass_suite_demo/`). Activates a single public
# const (`SUITE_DEMO_MARKER`) that the demo fixture references; the
# fixture only links when the dylib is built with `--features
# suite_demo` AND the per-fixture rustc receives `--cfg
# feature="suite_demo"`. Used by the `[[package.metadata.lihaaf.suite]]`
# named suite below to prove that feature-subset propagation works
# end-to-end. Not part of any public API contract.
suite_demo = []

# Self-test corpus. lihaaf consumes itself as the dylib_crate so the
# end-to-end dispatch pipeline exercises against a real fixture set in
# CI without depending on any downstream consumer crate. The fixture
# corpus lives under `tests/lihaaf/` (compile_pass + compile_fail
# subdirectories per spec §3.2). The CI workflow builds `cargo-lihaaf`
# and runs it against this corpus from the crate root.
#
# The default suite (top-level table) compiles the corpus with no
# Cargo features. The `suite_demo` named suite compiles a separate
# fixture directory with `--features suite_demo` enabled — proving the
# v0.1.0-alpha.3 multi-suite capability propagates the feature set to
# both the dylib build AND the per-fixture rustc dispatch. CI runs
# `cargo run --bin cargo-lihaaf -- lihaaf` (no `--suite`), which
# exercises every defined suite in declared metadata order.
[package.metadata.lihaaf]
dylib_crate = "lihaaf"
extern_crates = ["lihaaf"]
edition = "2024"

[[package.metadata.lihaaf.suite]]
name = "suite_demo"
features = ["suite_demo"]
fixture_dirs = ["tests/lihaaf/compile_pass_suite_demo"]
