name: refresh pilots (stage-2 cross-repo)

# v0.1 pilot-refresh orchestrator. Invokes the reusable
# `pilot-stage2.yml` workflow over every enrolled pilot fork
# synchronously via cross-repo `workflow_call`. See
# `compat/PILOTS.md` for the full operational flow and the v0.2
# refresh strategy.
#
# Execution-context (corrected from round-1):
# Per GitHub Actions docs
# (https://docs.github.com/en/actions/concepts/workflows-and-actions/reusing-workflow-configurations),
# a called reusable workflow runs as part of the CALLER's workflow
# run. That means:
# - `github.repository` inside the called workflow is `TarunvirBains/lihaaf`
#   (this orchestrator), NOT the fork — so `actions/checkout` must be
#   told explicitly which repo to check out (we pass `fork_repo`).
# - The artifacts produced by the called workflow appear in THIS
#   workflow run's Actions tab, not in each fork's Actions tab.
# - The GITHUB_TOKEN available to the called workflow is the
#   orchestrator's, scoped by the orchestrator's `permissions:` block
#   (`contents: read`).
#
# Security:
# - `workflow_dispatch` ONLY. NO `pull_request` / `pull_request_target`
#   trigger. Reason: cross-repo `workflow_call` from a PR-triggered
#   workflow would expose orchestrator inputs to PR authors, and
#   manual `workflow_dispatch` requires `repo` write scope which PR
#   authors don't have. Manual-only invocation matches the v0.1
#   manual drift-detection cadence and keeps the dispatch surface
#   gated to maintainers.
# - `permissions: contents: read` at workflow level. No issue / PR /
#   checks-API writes.
# - The six pilot jobs are HARDCODED here. Adding a new pilot
#   requires a PR to this file; this is intentional — pilot
#   enrollment is a review-gated event, not a config-file dynamic.
# - Each `uses:` line is SHA-pinned per the SHA-rotation workflow in
#   `compat/PILOTS.md`. Matrix expressions are documented as forbidden
#   in `jobs.<job_id>.uses` per
#   https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_iduses,
#   hence the six duplicated job blocks.
#
# v0.2 may add a scheduled trigger:
#   schedule:
#     - cron: '0 6 * * 1'  # Mondays 06:00 UTC
# Intentionally NOT enabled for v0.1: scheduled refreshes blur the
# stage-3 enrollment audit trail (a baseline.toml ceiling drift caused
# by a midnight refresh is harder to attribute than one tied to an
# explicit `Run workflow` click).

on:
  workflow_dispatch:
    inputs:
      lihaaf_version:
        description: 'lihaaf version each pilot installs via `cargo install` (published crates.io version)'
        required: false
        type: string
        default: '0.1.0-beta.9'

permissions:
  contents: read

# Six explicit jobs — one per enrolled pilot fork — because contexts
# and expressions (including matrix expressions) are forbidden in
# `jobs.<job_id>.uses` per GitHub Actions workflow syntax. The jobs
# run in parallel (no `needs:`); a fork failure does not cancel the
# others (the `fail-fast: false` matrix idiom is satisfied here
# by independent jobs).
#
# Round 1 (v0.1.0-beta.4 era): cxx, serde-json, anyhow, thiserror.
# Round 2 (v0.1.0-beta.9 + #53 workspace-member entry): derive_more,
# axum-macros. The axum-macros job sets `package: axum-macros` so the
# lihaaf compat driver enters the tokio-rs/axum workspace via that
# member; see `docs/compatibility-plan.md` §4.3 for the
# coverage-matrix rationale (derive macros + attribute proc-macros +
# `#[test]`-wrapped Trybuild).
jobs:
  refresh-cxx:
    name: refresh cxx
    uses: TarunvirBains/cxx-lihaaf-pilot/.github/workflows/pilot-stage2.yml@fa1fabee8d8cdb5ff5e2bea671f3161753826ffc
    with:
      fork_repo: TarunvirBains/cxx-lihaaf-pilot
      pilot_name: cxx
      fork_ref: master
      lihaaf_version: ${{ inputs.lihaaf_version }}
    permissions:
      contents: read

  refresh-serde-json:
    name: refresh serde-json
    uses: TarunvirBains/serde-json-lihaaf-pilot/.github/workflows/pilot-stage2.yml@9fac43bc674b856edf91e2a0d24aafc744b9eae8
    with:
      fork_repo: TarunvirBains/serde-json-lihaaf-pilot
      pilot_name: serde-json
      fork_ref: master
      lihaaf_version: ${{ inputs.lihaaf_version }}
    permissions:
      contents: read

  refresh-anyhow:
    name: refresh anyhow
    uses: TarunvirBains/anyhow-lihaaf-pilot/.github/workflows/pilot-stage2.yml@24b93a59831edf0a843942cfddc73498ce83682e
    with:
      fork_repo: TarunvirBains/anyhow-lihaaf-pilot
      pilot_name: anyhow
      fork_ref: master
      lihaaf_version: ${{ inputs.lihaaf_version }}
    permissions:
      contents: read

  refresh-thiserror:
    name: refresh thiserror
    uses: TarunvirBains/thiserror-lihaaf-pilot/.github/workflows/pilot-stage2.yml@9666a9c16146cf0740fcd73eba643110df7936a3
    with:
      fork_repo: TarunvirBains/thiserror-lihaaf-pilot
      pilot_name: thiserror
      fork_ref: master
      lihaaf_version: ${{ inputs.lihaaf_version }}
    permissions:
      contents: read

  refresh-derive_more:
    name: refresh derive_more
    uses: TarunvirBains/derive_more-lihaaf-pilot/.github/workflows/pilot-stage2.yml@a96c48efa838af95ea07a40397521296e1f99dde
    with:
      fork_repo: TarunvirBains/derive_more-lihaaf-pilot
      pilot_name: derive_more
      fork_ref: master
      lihaaf_version: ${{ inputs.lihaaf_version }}
    permissions:
      contents: read

  refresh-axum-macros:
    name: refresh axum-macros
    # Workspace-member entry: tokio-rs/axum is a multi-crate workspace
    # and axum-macros lives at `axum-macros/`. The orchestrator passes
    # `package: axum-macros` so the lihaaf compat driver resolves the
    # entry shape via `--compat-root <workspace-root>` + `--package
    # axum-macros` (see compatibility-plan.md §3.2 "Workspace-member
    # entry via `--package`"). This depends on lihaaf >= 0.1.0-beta.9
    # (issue #53). For Round 1 single-crate forks `package` stays
    # empty (template default).
    uses: TarunvirBains/axum-lihaaf-pilot/.github/workflows/pilot-stage2.yml@383a724dc3a11122a5987463c96b624d5c0f9541
    with:
      fork_repo: TarunvirBains/axum-lihaaf-pilot
      pilot_name: axum-macros
      fork_ref: main
      package: axum-macros
      lihaaf_version: ${{ inputs.lihaaf_version }}
    permissions:
      contents: read
