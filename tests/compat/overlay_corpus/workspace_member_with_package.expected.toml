[package]
autobenches = false
autobins = false
autoexamples = false
autotests = false
name = "pkg-macros"
version = "0.1.0"

[package.edition]
workspace = true

[lib]
crate-type = ["dylib", "rlib"]
path = "__UPSTREAM_DIR__/src/lib.rs"
proc-macro = true

[dependencies.serde]
workspace = true

[patch.crates-io.pkg-macros]
path = "__UPSTREAM_DIR__/target/lihaaf-overlay"

[workspace.dependencies]
serde = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.package]
edition = "2021"

[lints]
workspace = true
